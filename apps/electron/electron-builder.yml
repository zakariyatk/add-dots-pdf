# Packaging (npm run electron:build, electron:build:mac, electron:build:linux).
# The installers land in apps/electron/release/.
appId: com.adddots.pdf.electron
productName: Add Dots PDF
copyright: Add Dots
directories:
  output: release
  buildResources: build
files:
  - src/**
  - package.json
  - build/icon.*
extraResources:
  # the web app, served to the window from app://adddots (src/main.js)
  - from: ../web/dist
    to: web
asar: true
fileAssociations:
  - ext: pdf
    name: PDF document
    description: PDF document
    mimeType: application/pdf
    role: Editor
    icon: pdf-file
win:
  icon: build/icon.ico
  target:
    - target: nsis
      arch: [x64]
  artifactName: Add-Dots-PDF-${version}-setup.${ext}
nsis:
  oneClick: false
  perMachine: false
  allowToChangeInstallationDirectory: true
  include: build/installer.nsh
  shortcutName: Add Dots PDF
# The Microsoft Store package: npm run electron:build:store. The manifest,
# with the product's Store identity, is build/AppxManifest.xml; the tile and
# logo images are build/appx/. Its version is package.json's (1.0.N, CI sets
# N to the run number), as 1.0.N.0: the Store wants the last number 0.
appx:
  customManifestPath: AppxManifest.xml
  identityName: ADDDOTS.ADDDOTSPDF
  publisher: CN=B4571263-B820-4F66-B107-5B0CC5616541
  publisherDisplayName: ADD DOTS
  applicationId: App
  displayName: Add Dots PDF
  backgroundColor: transparent
  languages: [en-US]
  artifactName: ADD-DOTS-PDF-${version}.0.msix
mac:
  icon: build/icon.icns
  category: public.app-category.productivity
  target:
    - target: dmg
      arch: [x64, arm64]
    - target: zip
      arch: [x64, arm64]
linux:
  icon: build/icon.png
  category: Office
  synopsis: Read, edit and mark up PDFs
  target: [AppImage, deb]
  maintainer: Add Dots
# Electron's fuses, flipped in the packaged binary: it cannot be run as plain
# Node, takes no NODE_OPTIONS, loads the app only from its asar, and checks
# that asar against the hash built into the .exe. --inspect stays on: the
# end-to-end test drives the packaged app through it (e2e.mjs, APP=...).
electronFuses:
  runAsNode: false
  enableCookieEncryption: true
  enableNodeOptionsEnvironmentVariable: false
  enableNodeCliInspectArguments: true
  enableEmbeddedAsarIntegrityValidation: true
  onlyLoadAppFromAsar: true
