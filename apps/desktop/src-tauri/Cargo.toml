[package]
name = "adddots-pdf"
version = "0.1.0"
description = "Add Dots PDF reader and editor"
authors = ["ADD DOTS"]
edition = "2021"
rust-version = "1.77"

[lib]
name = "adddots_pdf_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-single-instance = "2"
tauri-plugin-dialog = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
libloading = "0.8"
flate2 = "1"

# Windows' own OCR (src/ocr.rs) and Store updates (src/store.rs); the same
# version Tauri already uses
[target.'cfg(windows)'.dependencies]
windows = { version = "0.62", features = [
  "ApplicationModel",
  "Foundation",
  "Foundation_Collections",
  "Globalization",
  "Graphics_Imaging",
  "Media_Ocr",
  "Services_Store",
  "Storage_Streams",
  "Win32_System_WinRT",
  "Win32_UI_Shell",
] }

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true
