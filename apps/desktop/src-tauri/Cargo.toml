[package]
name = "adddots-pdf"
version = "0.1.0"
description = "ADD DOTS PDF reader and editor"
authors = ["ADD DOTS"]
edition = "2021"
rust-version = "1.77"

[lib]
name = "adddots_pdf_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-single-instance = "2"
tauri-plugin-dialog = "2"
serde = { version = "1", features = ["derive"] }
libloading = "0.8"
flate2 = "1"

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true
