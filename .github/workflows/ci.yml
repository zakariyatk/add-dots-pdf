name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Which apps a pull request touches. The Windows, Android and iOS builds take
  # minutes each, so on a pull request each runs only when its own folder
  # changed; the web checks and the smoke test (which also runs every page
  # under the desktop app's security policy) always run. A push to main builds
  # every app, so nothing reaches a release unbuilt. A change to this file or
  # to the dependencies builds every app too.
  changes:
    name: Which apps changed
    runs-on: ubuntu-latest
    outputs:
      electron: ${{ steps.diff.outputs.electron }}
      android: ${{ steps.diff.outputs.android }}
      ios: ${{ steps.diff.outputs.ios }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - id: diff
        env:
          BASE: ${{ github.event.pull_request.base.sha }}
        run: |
          if [ "${{ github.event_name }}" != pull_request ]; then
            printf 'electron=true\nandroid=true\nios=true\n' >> "$GITHUB_OUTPUT"
            exit 0
          fi
          files=$(git diff --name-only "$BASE"...HEAD)
          echo "$files"
          all='^(\.github/workflows/ci\.yml|package\.json|package-lock\.json)$'
          has() { echo "$files" | grep -Eq "$1|$all" && echo true || echo false; }
          {
            echo "electron=$(has '^apps/electron/')"
            echo "android=$(has '^apps/mobile/(android/|[^/]+$)')"
            echo "ios=$(has '^apps/mobile/(ios/|[^/]+$)')"
          } | tee -a "$GITHUB_OUTPUT"

  web:
    name: Lint, type-check, test, build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run format:check
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - uses: actions/upload-artifact@v4
        with:
          name: web-dist
          path: apps/web/dist
          retention-days: 7

  smoke:
    name: Smoke test in Chrome
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run build
      # The benchmark files are generated from fixed seeds (bench/corpus.mjs);
      # cached so a run does not rebuild 100 MB of PDFs each time.
      - uses: actions/cache@v4
        with:
          path: apps/web/bench/.corpus
          key: bench-corpus-${{ hashFiles('apps/web/bench/corpus.mjs') }}
      # the runner's own Chrome: playwright-core downloads no browser
      - run: npm run smoke -w @adddots/web
        env:
          BENCH_CHANNEL: chrome
      # again, every page under the desktop app's content security policy
      # (apps/electron/src/csp.json), so a tool it would block fails here first
      - name: Smoke test under the desktop app's content security policy
        run: npm run smoke -w @adddots/web
        env:
          BENCH_CHANNEL: chrome
          ADDDOTS_CSP: '1'

  electron:
    name: Windows app (Electron)
    needs: changes
    if: needs.changes.outputs.electron == 'true'
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      # builds the web app first, then the setup .exe (electron-builder, NSIS)
      - run: npm run electron:build -w @adddots/electron
      # the app over apps/web/dist, started as Explorer starts it
      - run: npm run e2e -w @adddots/electron
      # the packaged app, as the installer puts it on disk
      - run: npm run e2e -w @adddots/electron
        env:
          APP: release/win-unpacked/Add Dots PDF.exe
      # a file over 150 MB is read a part at a time: every file is, here
      - run: npm run e2e -w @adddots/electron
        env:
          ADDDOTS_RANGE_MB: '0'
      # the Microsoft Store package (build/AppxManifest.xml: the product's
      # Store identity), version 1.0.N.0 with N this run's number, which only
      # grows, as the Store needs each package newer than the last. The
      # Microsoft Store workflow (store.yml) submits it from the artifact.
      - name: Build the Store package (MSIX)
        shell: pwsh
        working-directory: apps/electron
        run: |
          $v = "1.0.${{ github.run_number }}"
          npx electron-builder --win appx "-c.extraMetadata.version=$v"
          if ($LASTEXITCODE) { throw "electron-builder appx failed ($LASTEXITCODE)" }
          New-Item -ItemType Directory -Force -Path "$env:RUNNER_TEMP/msix" | Out-Null
          Move-Item "release/ADD-DOTS-PDF-$v.0.msix" "$env:RUNNER_TEMP/msix/"
          "ok  ADD-DOTS-PDF-$v.0.msix"
      # installed as the Store would (signed here with a throwaway certificate
      # for the Publisher name, which the Store replaces with its own), started
      # from the Start menu entry, then removed
      - name: Install and start the MSIX
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          $msix = Get-ChildItem "$env:RUNNER_TEMP/msix/*.msix" | Select-Object -First 1
          $test = Join-Path $env:RUNNER_TEMP 'test-signed.msix'
          Copy-Item $msix.FullName $test
          $cert = New-SelfSignedCertificate -Type Custom -Subject 'CN=B4571263-B820-4F66-B107-5B0CC5616541' `
            -KeyUsage DigitalSignature -CertStoreLocation 'Cert:\CurrentUser\My' `
            -TextExtension @('2.5.29.37={text}1.3.6.1.5.5.7.3.3', '2.5.29.19={text}')
          $pw = ConvertTo-SecureString -String 'test' -Force -AsPlainText
          Export-PfxCertificate -Cert $cert -FilePath "$env:RUNNER_TEMP/test.pfx" -Password $pw | Out-Null
          Export-Certificate -Cert $cert -FilePath "$env:RUNNER_TEMP/test.cer" | Out-Null
          Import-Certificate -FilePath "$env:RUNNER_TEMP/test.cer" -CertStoreLocation 'Cert:\LocalMachine\TrustedPeople' | Out-Null
          $signtool = Get-ChildItem "${env:ProgramFiles(x86)}\Windows Kits\10\bin\*\x64\signtool.exe" | Sort-Object FullName | Select-Object -Last 1
          & $signtool.FullName sign /fd SHA256 /f "$env:RUNNER_TEMP/test.pfx" /p test $test
          if ($LASTEXITCODE) { throw "signtool failed ($LASTEXITCODE)" }
          Add-AppxPackage -Path $test
          $pkg = Get-AppxPackage -Name 'ADDDOTS.ADDDOTSPDF'
          if (-not $pkg) { throw 'the MSIX did not install' }
          "ok  installed $($pkg.PackageFullName)"
          if ($pkg.Publisher -ne 'CN=B4571263-B820-4F66-B107-5B0CC5616541') { throw "publisher is $($pkg.Publisher)" }
          if (-not (Test-Path (Join-Path $pkg.InstallLocation 'app\Add Dots PDF.exe'))) { throw 'the app is not in the package' }
          if (-not (Test-Path (Join-Path $pkg.InstallLocation 'app\resources\web\index.html'))) { throw 'the web app is not in the package' }
          Start-Process "shell:AppsFolder\$($pkg.PackageFamilyName)!App"
          $p = $null
          for ($i = 0; $i -lt 30 -and -not $p; $i++) {
            Start-Sleep 1
            $p = Get-Process 'Add Dots PDF' -ErrorAction SilentlyContinue | Where-Object { $_.MainWindowHandle -ne 0 }
          }
          if (-not $p) { throw 'the packaged app did not open a window' }
          'ok  the packaged app starts'
          Get-Process 'Add Dots PDF' -ErrorAction SilentlyContinue | Stop-Process -Force
          Start-Sleep 2
          Remove-AppxPackage -Package $pkg.PackageFullName
          'ok  removed'
      - uses: actions/upload-artifact@v4
        with:
          name: windows-store-msix
          path: ${{ runner.temp }}/msix/*.msix
          retention-days: 30
      # the unsigned test installer: SmartScreen warns before running it
      - uses: actions/upload-artifact@v4
        with:
          name: windows-installer
          path: apps/electron/release/*-setup.exe
          retention-days: 14

  android:
    name: Android app (Capacitor)
    needs: changes
    if: needs.changes.outputs.android == 'true'
    runs-on: ubuntu-latest
    # an emulator that stops answering fails the run instead of holding it for hours
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
          cache: gradle
      - run: npm ci
      # the engine bundle first, then the web app it loads
      - run: npx turbo run build --filter=@adddots/web...
      - run: npx cap sync android
        working-directory: apps/mobile
      - run: ./gradlew assembleDebug --no-daemon
        working-directory: apps/mobile/android
      # unsigned test build: a debug APK, installable after allowing
      # "install unknown apps"
      - uses: actions/upload-artifact@v4
        with:
          name: android-apk
          path: apps/mobile/android/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 14
      # the app driven end to end on an emulator. The runner's disk is nearly
      # full once the SDK and the build are on it, and the emulator stops at
      # once ("Not enough space to create userdata"): toolchains this job
      # does not use go first, and the Gradle build output (the APK is
      # uploaded).
      - name: Free disk space for the emulator
        run: |
          df -h /
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android/sdk/ndk /opt/ghc /usr/local/.ghcup \
            /opt/hostedtoolcache/CodeQL /usr/local/share/boost /usr/local/share/powershell \
            /usr/share/swift /usr/local/julia* /opt/az
          sudo docker image prune --all --force > /dev/null || true
          cp apps/mobile/android/app/build/outputs/apk/debug/app-debug.apk "$RUNNER_TEMP/"
          rm -rf apps/mobile/android/app/build apps/mobile/android/build ~/.gradle/caches/build-cache-*
          df -h /
      - name: Enable KVM for the emulator
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      # 4 cores and 4 GB, as the emulator itself advises (with 2 cores page 1
      # often never drew); swangle_indirect (ANGLE on SwiftShader Vulkan): the
      # older swiftshader_indirect logged "Failed to bind to texture" on the
      # runs where the WebView stopped drawing
      - uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          target: google_apis
          arch: x86_64
          cores: 4
          ram-size: 4096M
          disable-animations: true
          emulator-options: -no-window -gpu swangle_indirect -no-snapshot -noaudio -no-boot-anim
          working-directory: apps/mobile
          script: node e2e-android.mjs "$RUNNER_TEMP/app-debug.apk"

  ios:
    name: iOS app (Capacitor)
    needs: changes
    if: needs.changes.outputs.ios == 'true'
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      # the engine bundle first, then the web app it loads
      - run: npx turbo run build --filter=@adddots/web...
      # WebKit, the engine of the iOS app: the web app's own check in it
      - run: npx playwright-core install webkit
      - run: node bench/webkit.mjs
        working-directory: apps/web
      - run: npx cap sync ios
        working-directory: apps/mobile
      # for the simulator: no signing, no Apple account needed
      - name: Build for the iOS simulator
        working-directory: apps/mobile/ios/App
        run: |
          set -o pipefail
          xcodebuild -project App.xcodeproj -scheme App -configuration Debug \
            -sdk iphonesimulator -destination 'generic/platform=iOS Simulator' \
            -derivedDataPath build CODE_SIGNING_ALLOWED=NO build | tail -40
      # installed on a simulator and started: still running after 20 s
      - name: Install and start on a simulator
        run: |
          set -euo pipefail
          APP=apps/mobile/ios/App/build/Build/Products/Debug-iphonesimulator/App.app
          DEV=$(xcrun simctl list devices available -j | node -e '
            const d = JSON.parse(require("fs").readFileSync(0, "utf8")).devices;
            const all = Object.entries(d).filter(([k]) => /iOS/.test(k)).flatMap(([, v]) => v);
            const p = all.find((x) => /^iPhone/.test(x.name));
            if (!p) process.exit(1);
            console.log(p.udid);')
          xcrun simctl boot "$DEV"
          xcrun simctl bootstatus "$DEV" -b
          xcrun simctl install "$DEV" "$APP"
          xcrun simctl launch "$DEV" com.adddots.pdf
          sleep 20
          xcrun simctl spawn "$DEV" launchctl list | grep com.adddots.pdf
          xcrun simctl io "$DEV" screenshot "$RUNNER_TEMP/ios-start.png"
          (cd "$(dirname "$APP")" && zip -qry "$RUNNER_TEMP/ios-simulator-app.zip" App.app)
      # a simulator build (runs in Xcode's simulator, not on a phone): a
      # phone build needs an Apple developer account to sign it
      - uses: actions/upload-artifact@v4
        with:
          name: ios-simulator-app
          path: |
            ${{ runner.temp }}/ios-simulator-app.zip
            ${{ runner.temp }}/ios-start.png
          retention-days: 14

  legacy-api:
    name: PHP share API unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
      - run: php legacy/api/tests/unit.php
