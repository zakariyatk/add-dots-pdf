name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  web:
    name: Lint, type-check, test, build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run format:check
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - uses: actions/upload-artifact@v4
        with:
          name: web-dist
          path: apps/web/dist
          retention-days: 7

  smoke:
    name: Smoke test in Chrome
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run build
      # The benchmark files are generated from fixed seeds (bench/corpus.mjs);
      # cached so a run does not rebuild 100 MB of PDFs each time.
      - uses: actions/cache@v4
        with:
          path: apps/web/bench/.corpus
          key: bench-corpus-${{ hashFiles('apps/web/bench/corpus.mjs') }}
      # the runner's own Chrome: playwright-core downloads no browser
      - run: npm run smoke -w @adddots/web
        env:
          BENCH_CHANNEL: chrome

  desktop:
    name: Windows app (Tauri)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: apps/desktop/src-tauri
      - run: npm ci
      - run: cargo test --manifest-path apps/desktop/src-tauri/Cargo.toml
      # builds the web app first (beforeBuildCommand), then the installers
      - run: npx tauri build
        working-directory: apps/desktop
      # the setup .exe as a reader runs it: it must not ask for an
      # administrator (asInvoker, like WPS), and it installs for this user
      # only, under %LOCALAPPDATA%, never Program Files
      - name: Install from the setup .exe
        shell: pwsh
        run: |
          $setup = Get-ChildItem apps/desktop/src-tauri/target/release/bundle/nsis/*-setup.exe | Select-Object -First 1
          if (-not $setup) { throw 'no setup .exe was built' }
          $text = [Text.Encoding]::ASCII.GetString([IO.File]::ReadAllBytes($setup.FullName))
          if ($text -notmatch 'requestedExecutionLevel level="asInvoker"') { throw "$($setup.Name) asks Windows for an administrator: its manifest is not asInvoker" }
          "ok  $($setup.Name) runs as the user (asInvoker)"
          $p = Start-Process $setup.FullName -ArgumentList '/S' -Wait -PassThru
          if ($p.ExitCode -ne 0) { throw "the installer exited with $($p.ExitCode)" }
          # where it went, as Windows records it: this user's list of
          # installed programs (HKCU), not the computer's (HKLM)
          $keys = 'Software\Microsoft\Windows\CurrentVersion\Uninstall\*'
          $mine = Get-ItemProperty "HKCU:\$keys" -ErrorAction SilentlyContinue | Where-Object DisplayName -like 'ADD DOTS PDF*'
          $all = Get-ItemProperty "HKLM:\$keys", "HKLM:\Software\WOW6432Node\Microsoft\Windows\CurrentVersion\Uninstall\*" -ErrorAction SilentlyContinue | Where-Object DisplayName -like 'ADD DOTS PDF*'
          if ($all) { throw 'installed for the whole computer (HKLM): that needs an administrator' }
          if (-not $mine) { throw 'not in this user''s installed programs' }
          $dir = ($mine | Select-Object -First 1).InstallLocation
          if (-not $dir) { $dir = Split-Path ((($mine | Select-Object -First 1).UninstallString) -replace '"', '') }
          $dir = $dir.Trim('"')
          if (-not $dir.StartsWith($env:LOCALAPPDATA)) { throw "installed at $dir, not under this user's %LOCALAPPDATA%" }
          $app = Get-ChildItem $dir -Filter *.exe | Where-Object Name -notlike 'uninstall*' | Select-Object -First 1
          if (-not $app) { Get-ChildItem $dir; throw "no app in $dir" }
          "ok  installed for this user: $($app.FullName)"
          "INSTALLED_APP=$($app.FullName)" >> $env:GITHUB_ENV
          "INSTALLED_DIR=$dir" >> $env:GITHUB_ENV
      # the installed app driven end to end: Playwright over WebView2's
      # DevTools port
      - run: node e2e.mjs
        working-directory: apps/desktop
        env:
          APP: ${{ env.INSTALLED_APP }}
      - name: Uninstall
        shell: pwsh
        run: |
          $un = Join-Path $env:INSTALLED_DIR 'uninstall.exe'
          $p = Start-Process $un -ArgumentList '/S' -Wait -PassThru
          if ($p.ExitCode -ne 0) { throw "the uninstaller exited with $($p.ExitCode)" }
          # the silent uninstaller hands off to a copy of itself: give it a moment
          for ($i = 0; $i -lt 30 -and (Test-Path $env:INSTALLED_APP); $i++) { Start-Sleep 1 }
          if (Test-Path $env:INSTALLED_APP) { throw 'the app is still there after uninstalling' }
          'ok  uninstalled'
      # the Microsoft Store package (apps/desktop/msix): the same app, as an
      # MSIX with the identity Partner Center gave it. Its version climbs
      # with every run, as each Store submission needs a higher one.
      - name: Pack the Store package (MSIX)
        shell: pwsh
        run: |
          $v = "1.0.${{ github.run_number }}.0"
          New-Item -ItemType Directory -Force -Path "$env:RUNNER_TEMP/msix" | Out-Null
          pwsh apps/desktop/msix/pack.ps1 -Version $v -Out "$env:RUNNER_TEMP/msix/ADD-DOTS-PDF-$v.msix"
      # installed as the Store would (signed here with a throwaway certificate
      # for the Publisher name, which the Store replaces with its own), started
      # from the Start menu entry, then removed
      - name: Install and start the MSIX
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          $msix = Get-ChildItem "$env:RUNNER_TEMP/msix/*.msix" | Select-Object -First 1
          $test = Join-Path $env:RUNNER_TEMP 'test-signed.msix'
          Copy-Item $msix.FullName $test
          $cert = New-SelfSignedCertificate -Type Custom -Subject 'CN=B4571263-B820-4F66-B107-5B0CC5616541' `
            -KeyUsage DigitalSignature -CertStoreLocation 'Cert:\CurrentUser\My' `
            -TextExtension @('2.5.29.37={text}1.3.6.1.5.5.7.3.3', '2.5.29.19={text}')
          $pw = ConvertTo-SecureString -String 'test' -Force -AsPlainText
          Export-PfxCertificate -Cert $cert -FilePath "$env:RUNNER_TEMP/test.pfx" -Password $pw | Out-Null
          Export-Certificate -Cert $cert -FilePath "$env:RUNNER_TEMP/test.cer" | Out-Null
          Import-Certificate -FilePath "$env:RUNNER_TEMP/test.cer" -CertStoreLocation 'Cert:\LocalMachine\TrustedPeople' | Out-Null
          $signtool = Get-ChildItem "${env:ProgramFiles(x86)}\Windows Kits\10\bin\*\x64\signtool.exe" | Sort-Object FullName | Select-Object -Last 1
          & $signtool.FullName sign /fd SHA256 /f "$env:RUNNER_TEMP/test.pfx" /p test $test
          if ($LASTEXITCODE) { throw "signtool failed ($LASTEXITCODE)" }
          Add-AppxPackage -Path $test
          $pkg = Get-AppxPackage -Name 'ADDDOTS.ADDDOTSPDF'
          if (-not $pkg) { throw 'the MSIX did not install' }
          "ok  installed $($pkg.PackageFullName)"
          if (-not (Test-Path (Join-Path $pkg.InstallLocation 'adddots-pdf.exe'))) { throw 'the app is not in the package' }
          Start-Process "shell:AppsFolder\$($pkg.PackageFamilyName)!App"
          $p = $null
          for ($i = 0; $i -lt 30 -and -not $p; $i++) { Start-Sleep 1; $p = Get-Process adddots-pdf -ErrorAction SilentlyContinue }
          if (-not $p) { throw 'the packaged app did not start' }
          'ok  the packaged app starts'
          $p | Stop-Process -Force
          Remove-AppxPackage -Package $pkg.PackageFullName
          'ok  removed'
      - uses: actions/upload-artifact@v4
        with:
          name: windows-store-msix
          path: ${{ runner.temp }}/msix/*.msix
          retention-days: 30
      # the unsigned test installer: Windows SmartScreen warns before running
      # it. One setup .exe for this user, no administrator (no .msi: an MSI
      # installs for the whole computer and asks for one)
      - uses: actions/upload-artifact@v4
        with:
          name: windows-installer
          path: apps/desktop/src-tauri/target/release/bundle/nsis/*-setup.exe
          retention-days: 14

  android:
    name: Android app (Capacitor)
    runs-on: ubuntu-latest
    # an emulator that stops answering fails the run instead of holding it for hours
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
          cache: gradle
      - run: npm ci
      # the engine bundle first, then the web app it loads
      - run: npx turbo run build --filter=@adddots/web...
      - run: npx cap sync android
        working-directory: apps/mobile
      - run: ./gradlew assembleDebug --no-daemon
        working-directory: apps/mobile/android
      # unsigned test build: a debug APK, installable after allowing
      # "install unknown apps"
      - uses: actions/upload-artifact@v4
        with:
          name: android-apk
          path: apps/mobile/android/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 14
      # the app driven end to end on an emulator. The runner's disk is nearly
      # full once the SDK and the build are on it, and the emulator stops at
      # once ("Not enough space to create userdata"): toolchains this job
      # does not use go first, and the Gradle build output (the APK is
      # uploaded).
      - name: Free disk space for the emulator
        run: |
          df -h /
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android/sdk/ndk /opt/ghc /usr/local/.ghcup \
            /opt/hostedtoolcache/CodeQL /usr/local/share/boost /usr/local/share/powershell \
            /usr/share/swift /usr/local/julia* /opt/az
          sudo docker image prune --all --force > /dev/null || true
          cp apps/mobile/android/app/build/outputs/apk/debug/app-debug.apk "$RUNNER_TEMP/"
          rm -rf apps/mobile/android/app/build apps/mobile/android/build ~/.gradle/caches/build-cache-*
          df -h /
      - name: Enable KVM for the emulator
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          target: google_apis
          arch: x86_64
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim
          working-directory: apps/mobile
          script: node e2e-android.mjs "$RUNNER_TEMP/app-debug.apk"

  ios:
    name: iOS app (Capacitor)
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      # the engine bundle first, then the web app it loads
      - run: npx turbo run build --filter=@adddots/web...
      # WebKit, the engine of the iOS app: the web app's own check in it
      - run: npx playwright-core install webkit
      - run: node bench/webkit.mjs
        working-directory: apps/web
      - run: npx cap sync ios
        working-directory: apps/mobile
      # for the simulator: no signing, no Apple account needed
      - name: Build for the iOS simulator
        working-directory: apps/mobile/ios/App
        run: |
          set -o pipefail
          xcodebuild -project App.xcodeproj -scheme App -configuration Debug \
            -sdk iphonesimulator -destination 'generic/platform=iOS Simulator' \
            -derivedDataPath build CODE_SIGNING_ALLOWED=NO build | tail -40
      # installed on a simulator and started: still running after 20 s
      - name: Install and start on a simulator
        run: |
          set -euo pipefail
          APP=apps/mobile/ios/App/build/Build/Products/Debug-iphonesimulator/App.app
          DEV=$(xcrun simctl list devices available -j | node -e '
            const d = JSON.parse(require("fs").readFileSync(0, "utf8")).devices;
            const all = Object.entries(d).filter(([k]) => /iOS/.test(k)).flatMap(([, v]) => v);
            const p = all.find((x) => /^iPhone/.test(x.name));
            if (!p) process.exit(1);
            console.log(p.udid);')
          xcrun simctl boot "$DEV"
          xcrun simctl bootstatus "$DEV" -b
          xcrun simctl install "$DEV" "$APP"
          xcrun simctl launch "$DEV" com.adddots.pdf
          sleep 20
          xcrun simctl spawn "$DEV" launchctl list | grep com.adddots.pdf
          xcrun simctl io "$DEV" screenshot "$RUNNER_TEMP/ios-start.png"
          (cd "$(dirname "$APP")" && zip -qry "$RUNNER_TEMP/ios-simulator-app.zip" App.app)
      # a simulator build (runs in Xcode's simulator, not on a phone): a
      # phone build needs an Apple developer account to sign it
      - uses: actions/upload-artifact@v4
        with:
          name: ios-simulator-app
          path: |
            ${{ runner.temp }}/ios-simulator-app.zip
            ${{ runner.temp }}/ios-start.png
          retention-days: 14

  legacy-api:
    name: PHP share API unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
      - run: php legacy/api/tests/unit.php
