name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  web:
    name: Lint, type-check, test, build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run format:check
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - uses: actions/upload-artifact@v4
        with:
          name: web-dist
          path: apps/web/dist
          retention-days: 7

  smoke:
    name: Smoke test in Chrome
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run build
      # The benchmark files are generated from fixed seeds (bench/corpus.mjs);
      # cached so a run does not rebuild 100 MB of PDFs each time.
      - uses: actions/cache@v4
        with:
          path: apps/web/bench/.corpus
          key: bench-corpus-${{ hashFiles('apps/web/bench/corpus.mjs') }}
      # the runner's own Chrome: playwright-core downloads no browser
      - run: npm run smoke -w @adddots/web
        env:
          BENCH_CHANNEL: chrome

  desktop:
    name: Windows app (Tauri)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: apps/desktop/src-tauri
      - run: npm ci
      - run: cargo test --manifest-path apps/desktop/src-tauri/Cargo.toml
      # builds the web app first (beforeBuildCommand), then the installers
      - run: npx tauri build
        working-directory: apps/desktop
      # the app driven end to end: Playwright over WebView2's DevTools port
      - run: node e2e.mjs
        working-directory: apps/desktop
        env:
          APP: ${{ github.workspace }}\apps\desktop\src-tauri\target\release\adddots-pdf.exe
      # unsigned test installers: Windows SmartScreen warns before running them
      - uses: actions/upload-artifact@v4
        with:
          name: windows-installers
          path: |
            apps/desktop/src-tauri/target/release/bundle/nsis/*.exe
            apps/desktop/src-tauri/target/release/bundle/msi/*.msi
          retention-days: 14

  android:
    name: Android app (Capacitor)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
          cache: gradle
      - run: npm ci
      # the engine bundle first, then the web app it loads
      - run: npx turbo run build --filter=@adddots/web...
      - run: npx cap sync android
        working-directory: apps/mobile
      - run: ./gradlew assembleDebug --no-daemon
        working-directory: apps/mobile/android
      # unsigned test build: a debug APK, installable after allowing
      # "install unknown apps"
      - uses: actions/upload-artifact@v4
        with:
          name: android-apk
          path: apps/mobile/android/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 14
      # the app driven end to end on an emulator
      - name: Enable KVM for the emulator
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          target: google_apis
          arch: x86_64
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim
          working-directory: apps/mobile
          script: node e2e-android.mjs

  legacy-api:
    name: PHP share API unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
      - run: php legacy/api/tests/unit.php
