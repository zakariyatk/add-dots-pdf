name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  web:
    name: Lint, type-check, test, build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run format:check
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - uses: actions/upload-artifact@v4
        with:
          name: web-dist
          path: apps/web/dist
          retention-days: 7

  smoke:
    name: Smoke test in Chrome
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run build
      # The benchmark files are generated from fixed seeds (bench/corpus.mjs);
      # cached so a run does not rebuild 100 MB of PDFs each time.
      - uses: actions/cache@v4
        with:
          path: apps/web/bench/.corpus
          key: bench-corpus-${{ hashFiles('apps/web/bench/corpus.mjs') }}
      # the runner's own Chrome: playwright-core downloads no browser
      - run: npm run smoke -w @adddots/web
        env:
          BENCH_CHANNEL: chrome

  desktop:
    name: Windows app (Tauri)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: apps/desktop/src-tauri
      - run: npm ci
      - run: cargo test --manifest-path apps/desktop/src-tauri/Cargo.toml
      # builds the web app first (beforeBuildCommand), then the installers
      - run: npx tauri build
        working-directory: apps/desktop
      # the app driven end to end through WebDriver: tauri-driver in front of
      # Edge's driver, matched to the WebView2 on the runner
      - name: Install tauri-driver and msedgedriver
        shell: pwsh
        run: |
          cargo install tauri-driver --locked
          cargo install --git https://github.com/chippers/msedgedriver-tool
          & "$HOME/.cargo/bin/msedgedriver-tool.exe"
          $PWD.Path >> $env:GITHUB_PATH
      - run: node e2e.mjs
        working-directory: apps/desktop
        env:
          APP: ${{ github.workspace }}\apps\desktop\src-tauri\target\release\adddots-pdf.exe
      # unsigned test installers: Windows SmartScreen warns before running them
      - uses: actions/upload-artifact@v4
        with:
          name: windows-installers
          path: |
            apps/desktop/src-tauri/target/release/bundle/nsis/*.exe
            apps/desktop/src-tauri/target/release/bundle/msi/*.msi
          retention-days: 14

  legacy-api:
    name: PHP share API unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
      - run: php legacy/api/tests/unit.php
